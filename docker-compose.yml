version: '3.8'

# ============================================================
# SampMail - Self-hosted Email Marketing Platform
# 
# Architecture:
#   - KumoMTA: Installed on HOST OS (not in Docker)
#   - SampMail + Postgres + Redis + Reacher: In Docker
#
# IMPORTANT: Port 25 should NEVER be open to the world!
#   - Port 25: BLOCKED (or localhost only for KumoMTA internal)
#   - Port 587: Used for authenticated submission (SampMail → KumoMTA)
#   - Port 465: Optional SMTPS
#
# Powered by:
#   - KumoMTA (https://kumomta.com) - High-performance MTA
#   - Reacher (https://reacher.email) - Email verification
# ============================================================

services:
  # ----------------------------------------
  # SampMail - Main Application
  # ----------------------------------------
  sampmail:
    build:
      context: .
      args:
        VERSION: ${SAMPMAIL_VERSION:-0.4.0}
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: pulak-ranjan/sampmail:latest
    container_name: sampmail
    restart: unless-stopped
    ports:
      - "9000:9000"
    extra_hosts:
      # Allow container to reach KumoMTA on host
      - "host.docker.internal:host-gateway"
    environment:
      # Required - auto-generated by install.sh or: openssl rand -base64 32
      - SAMPMAIL_SECRET=${SAMPMAIL_SECRET:?SAMPMAIL_SECRET is required}

      # Public-facing base URL for tracking/unsubscribe links.
      # Auto-detected by install.sh; update to https://... once TLS is set up.
      # Example: SAMPMAIL_BASE_URL=https://mail.yourdomain.com
      - SAMPMAIL_BASE_URL=${SAMPMAIL_BASE_URL:-http://localhost:9000}

      # Server settings
      - SAMPMAIL_LISTEN_ADDR=0.0.0.0:9000
      - SAMPMAIL_DATA_DIR=/var/lib/sampmail
      - SAMPMAIL_ENV=production
      
      # Database (PostgreSQL recommended for production)
      - SAMPMAIL_DB_DRIVER=${SAMPMAIL_DB_DRIVER:-sqlite}
      - SAMPMAIL_PG_HOST=postgres
      - SAMPMAIL_PG_PORT=5432
      - SAMPMAIL_PG_USER=${POSTGRES_USER:-sampmail}
      - SAMPMAIL_PG_PASSWORD=${POSTGRES_PASSWORD:-}
      - SAMPMAIL_PG_DATABASE=${POSTGRES_DB:-sampmail}
      - SAMPMAIL_PG_SSLMODE=disable
      - SAMPMAIL_DB_MAX_OPEN_CONNS=100
      - SAMPMAIL_DB_MAX_IDLE_CONNS=10
      
      # Redis (for distributed rate limiting)
      - SAMPMAIL_REDIS_ADDR=${SAMPMAIL_REDIS_ADDR:-redis:6379}
      - SAMPMAIL_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # ================================================
      # KumoMTA Integration (RUNNING ON HOST OS)
      # ================================================
      # SampMail connects to KumoMTA via port 587 (submission)
      # Port 25 is NEVER used for sending - only for receiving (blocked)
      # ================================================
      - SAMPMAIL_KUMO_DIR=/opt/kumomta
      - SAMPMAIL_LOG_DIR=/var/log/kumomta
      # Connect to KumoMTA on host via submission port (587)
      - SAMPMAIL_SMTP_ADDR=host.docker.internal:587
      - SAMPMAIL_SMTP_AUTH_USER=${SMTP_AUTH_USER:-}
      - SAMPMAIL_SMTP_AUTH_PASS=${SMTP_AUTH_PASS:-}
      - SAMPMAIL_SMTP_MAX_CONNS=100
      - SAMPMAIL_SMTP_MIN_CONNS=5
      
      # Reacher integration (email verification)
      - REACHER_URL=http://reacher:8080
      
      # Performance
      - SAMPMAIL_CAMPAIGN_WORKERS=50
      - SAMPMAIL_REQUEST_TIMEOUT=30s
      - SAMPMAIL_MAX_REQUEST_BODY=10485760
      
      # Security
      - SAMPMAIL_TRUST_PROXY=true
      - SAMPMAIL_TRUSTED_PROXY_CIDR=172.16.0.0/12,10.0.0.0/8
      - SAMPMAIL_BCRYPT_COST=12
      
      # Monitoring
      - SAMPMAIL_METRICS_ENABLED=true
      - SAMPMAIL_METRICS_PATH=/metrics
      - SAMPMAIL_LOG_JSON=true
      - SAMPMAIL_LOG_LEVEL=info
      
      # Backup
      - SAMPMAIL_BACKUP_RETENTION=7
    volumes:
      - sampmail-data:/var/lib/sampmail
      # Mount KumoMTA logs from host (read-only)
      - /var/log/kumomta:/var/log/kumomta:ro
      # Mount KumoMTA config from host (for DKIM management)
      - /opt/kumomta/etc:/opt/kumomta/etc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reacher:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sampmail-network
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ----------------------------------------
  # PostgreSQL - Production Database
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sampmail-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sampmail}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sampmail}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sampmail} -d ${POSTGRES_DB:-sampmail}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sampmail-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ----------------------------------------
  # Redis - Distributed Rate Limiting & Caching
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sampmail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sampmail-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------
  # Reacher - Email Verification Service
  # https://github.com/reacherhq/check-if-email-exists
  # ----------------------------------------
  reacher:
    image: reacherhq/backend:latest
    container_name: reacher
    restart: unless-stopped
    environment:
      # Enable bulk verification
      - RCH_ENABLE_BULK=true
      # Optional: Set your own SMTP for verification
      # - RCH_FROM_EMAIL=verify@yourdomain.com
      # - RCH_HELLO_NAME=yourdomain.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sampmail-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------
  # KumoMTA - Mail Transfer Agent
  # High-performance MTA for email delivery
  # https://kumomta.com
  # ----------------------------------------
  kumomta:
    image: ghcr.io/kumomta/kumomta:latest
    container_name: kumomta
    restart: unless-stopped
    ports:
      # Port 587 - Submission (authenticated) - ONLY THIS IS EXPOSED
      - "587:587"
      # Port 465 - SMTPS (optional, for TLS)
      - "465:465"
      # NOTE: Port 25 is NOT exposed to world to prevent spam/abuse
      # Port 25 is only available internally within Docker network
    environment:
      - KUMO_LOG_LEVEL=info
    volumes:
      - kumomta-config:/opt/kumomta/etc
      - kumomta-spool:/var/spool/kumomta
      - kumomta-logs:/var/log/kumomta
      - kumomta-dkim:/opt/kumomta/etc/dkim
    networks:
      - sampmail-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "587"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sampmail-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kumomta-config:
    driver: local
  kumomta-logs:
    driver: local
  kumomta-spool:
    driver: local
  kumomta-dkim:
    driver: local

networks:
  sampmail-network:
    driver: bridge

